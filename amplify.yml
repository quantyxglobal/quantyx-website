version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - echo "VITE_DASHBOARD_URL=$VITE_DASHBOARD_URL" >> .env
        - echo "VITE_AWS_ACCESS_KEY_ID=$VITE_AWS_ACCESS_KEY_ID" >> .env
        - echo "VITE_AWS_SECRET_ACCESS_KEY=$VITE_AWS_SECRET_ACCESS_KEY" >> .env
        - echo "VITE_AWS_REGION=$VITE_AWS_REGION" >> .env
        - echo "VITE_AWS_S3_BUCKET_NAME=$VITE_AWS_S3_BUCKET_NAME" >> .env
        - echo "VITE_POSTMARK_SERVER_TOKEN=$VITE_POSTMARK_SERVER_TOKEN" >> .env
        - echo "VITE_SUPPORT_EMAIL=$VITE_SUPPORT_EMAIL" >> .env
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  # SPA configuration for proper routing
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
        - key: 'Strict-Transport-Security'
          value: 'max-age=31536000; includeSubDomains; preload'
        - key: 'X-Content-Type-Options'
          value: 'nosniff'
        - key: 'X-Frame-Options'
          value: 'DENY'
        - key: 'X-XSS-Protection'
          value: '1; mode=block'
        - key: 'Referrer-Policy'
          value: 'strict-origin-when-cross-origin'
        - key: 'Permissions-Policy'
          value: 'camera=(), microphone=(), geolocation=(), interest-cohort=()'
        - key: 'Content-Security-Policy'
          value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://dashboard.quantyxg.com https://*.supabase.co https://*.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    - pattern: '/index.html'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache, no-store, must-revalidate'
    - pattern: '/sitemap.xml'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=86400'
    - pattern: '/robots.txt'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=86400'
    - pattern: '**/*.pdf'
      headers:
        - key: 'Content-Type'
          value: 'application/pdf'
        - key: 'Cache-Control'
          value: 'public, max-age=31536000'
        - key: 'Content-Disposition'
          value: 'inline'
