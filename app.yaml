runtime: nodejs20

env: standard

instance_class: F2

automatic_scaling:
  min_idle_instances: 0
  max_idle_instances: 1
  min_pending_latency: 1000ms
  max_pending_latency: 5000ms

env_variables:
  NODE_ENV: 'production'
  PORT: '8080'

handlers:
  # Serve static assets with caching
  - url: /assets
    static_dir: dist/assets
    secure: always
    http_headers:
      Cache-Control: 'public, max-age=31536000, immutable'
  
  # Serve images with caching
  - url: /(.*\.(jpg|jpeg|png|gif|svg|webp|ico))$
    static_files: dist/\1
    upload: dist/.*\.(jpg|jpeg|png|gif|svg|webp|ico)$
    secure: always
    http_headers:
      Cache-Control: 'public, max-age=31536000, immutable'
  
  # Serve PDFs
  - url: /(.*\.pdf)$
    static_files: dist/\1
    upload: dist/.*\.pdf$
    secure: always
    http_headers:
      Cache-Control: 'public, max-age=86400'
      Content-Type: 'application/pdf'
  
  # All other requests go to the Node.js server
  - url: /.*
    script: auto
    secure: always
